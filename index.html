<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Chat Pro</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; }
    
    #username-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 10; }
    #username-form { background: #fff; padding: 20px; border-radius: 12px; text-align: center; width: 85%; max-width: 320px; }
    #username-form input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    #username-form button { width: 100%; padding: 10px; background: #075e54; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; }

    header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    
    #messages { list-style-type: none; margin: 0; padding: 15px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }
    
    .message { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 15px; position: relative; word-wrap: break-word; }
    .message.received { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; }
    .message.sent { background: #dcf8c6; align-self: flex-end; border-top-right-radius: 0; }
    
    .meta { font-size: 11px; color: #888; margin-top: 4px; display: flex; justify-content: space-between; gap: 10px; }
    .username { font-weight: bold; font-size: 12px; color: #128c7e; margin-bottom: 2px; }

    #form { background: #f0f0f0; padding: 10px; display: flex; gap: 8px; align-items: center; }
    #input { border: 1px solid #ccc; padding: 12px 15px; flex-grow: 1; border-radius: 20px; outline: none; font-size: 15px; }
    #form button { background: #075e54; border: none; padding: 12px 18px; border-radius: 50%; color: #fff; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="username-modal">
    <div id="username-form">
      <h3>Choisissez un Pseudo</h3>
      <input id="username-input" placeholder="Votre nom..." autocomplete="off" />
      <button id="start-btn">Rejoindre</button>
    </div>
  </div>

  <header>Chat en Temps Réel</header>
  <ul id="messages"></ul>

  <form id="form" action="">
    <input id="input" autocomplete="off" placeholder="Tapez un message..." />
    <button>➔</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    var socket = io();
    var username = '';

    var modal = document.getElementById('username-modal');
    var userInput = document.getElementById('username-input');
    var startBtn = document.getElementById('start-btn');
    var form = document.getElementById('form');
    var input = document.getElementById('input');

    startBtn.addEventListener('click', function(e) {
      e.preventDefault();
      if (userInput.value.trim()) {
        username = userInput.value.trim();
        modal.style.display = 'none';
      }
    });

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      if (input.value.trim() && username) {
        var now = new Date();
        var timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        
        socket.emit('chat message', {
          user: username,
          text: input.value,
          time: timeStr
        });
        input.value = '';
      }
    });

    socket.on('chat message', function(data) {
      var item = document.createElement('li');
      var isMe = data.user === username;
      item.className = 'message ' + (isMe ? 'sent' : 'received');

      item.innerHTML = `
        ${!isMe ? `<div class="username">${data.user}</div>` : ''}
        <div>${data.text}</div>
        <div class="meta"><span></span><span>${data.time}</span></div>
      `;
      
      document.getElementById('messages').appendChild(item);
      window.scrollTo(0, document.body.scrollHeight);
    });
  </script>
</body>
</html>
