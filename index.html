<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAY Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; }
    #auth-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
    #auth-screen h1 { margin-bottom: 20px; color: #4CAF50; }
    .auth-box { width: 100%; max-width: 320px; background: #1f1f1f; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; }
    .auth-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2b2b2b; color: #fff; font-size: 14px; }
    .auth-box button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #4CAF50; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
    .toggle-link { color: #888; font-size: 13px; text-align: center; cursor: pointer; text-decoration: underline; margin-top: 5px; }
    .error-msg { color: #ff5252; font-size: 12px; text-align: center; }

    #chat-screen { display: none; flex-direction: column; height: 100vh; }
    header { background: #1f1f1f; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; border-bottom: 1px solid #333; color: #4CAF50; }
    #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { background: #222; padding: 10px 14px; border-radius: 12px; max-width: 80%; width: fit-content; word-break: break-word; }
    .msg.me { background: #4CAF50; color: white; align-self: flex-end; }
    .msg.system { background: transparent; color: #888; font-size: 12px; align-self: center; text-align: center; }
    .msg .author { font-size: 11px; opacity: 0.85; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .msg .time { font-size: 10px; opacity: 0.7; font-weight: normal; margin-left: 8px; }
    form { display: flex; padding: 10px; background: #1f1f1f; gap: 8px; }
    form input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #2b2b2b; color: white; outline: none; }
    form button { background: #4CAF50; color: white; border: none; padding: 0 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="auth-screen">
    <h1>JAY Chat</h1>
    
    <!-- Formulaire de Connexion -->
    <div class="auth-box" id="login-box">
      <div id="login-error" class="error-msg"></div>
      <input type="text" id="login-id" placeholder="Numéro de téléphone ou E-mail" />
      <input type="password" id="login-pass" placeholder="Mot de passe" />
      <button onclick="handleLogin()">Se Connecter</button>
      <div class="toggle-link" onclick="toggleAuth(true)">Pas encore de compte ? S'inscrire</div>
    </div>

    <!-- Formulaire d'Inscription -->
    <div class="auth-box" id="register-box" style="display: none;">
      <div id="reg-error" class="error-msg"></div>
      <input type="text" id="reg-id" placeholder="Numéro de téléphone ou E-mail" />
      <input type="text" id="reg-username" placeholder="Pseudo dans le chat" />
      <input type="password" id="reg-pass" placeholder="Créer un mot de passe" />
      <button onclick="handleRegister()">Créer mon compte</button>
      <div class="toggle-link" onclick="toggleAuth(false)">Déjà un compte ? Se connecter</div>
    </div>
  </div>

  <div id="chat-screen">
    <header>JAY Chat</header>
    <div id="messages"></div>
    <form id="chat-form" onsubmit="sendMessage(event)">
      <input type="text" id="msg-input" placeholder="Écrivez un message..." required autocomplete="off" />
      <button type="submit">Envoyer</button>
    </form>
  </div>

  <script>
    const socket = io();
    let myUsername = "";

    function toggleAuth(showRegister) {
      document.getElementById('login-box').style.display = showRegister ? 'none' : 'flex';
      document.getElementById('register-box').style.display = showRegister ? 'flex' : 'none';
      document.getElementById('login-error').innerText = '';
      document.getElementById('reg-error').innerText = '';
    }

    async function handleLogin() {
      const identifier = document.getElementById('login-id').value;
      const password = document.getElementById('login-pass').value;
      const errorDiv = document.getElementById('login-error');

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier, password })
      });
      const data = await res.json();

      if (data.success) {
        startChat(data.username);
      } else {
        errorDiv.innerText = data.error || 'Erreur de connexion';
      }
    }

    async function handleRegister() {
      const identifier = document.getElementById('reg-id').value;
      const username = document.getElementById('reg-username').value;
      const password = document.getElementById('reg-pass').value;
      const errorDiv = document.getElementById('reg-error');

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier, username, password })
      });
      const data = await res.json();

      if (data.success) {
        startChat(data.username);
      } else {
        errorDiv.innerText = data.error || 'Erreur de création de compte';
      }
    }

    function startChat(username) {
      myUsername = username;
      socket.emit('join', myUsername);
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('chat-screen').style.display = 'flex';
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      socket.emit('chat-message', text);
      input.value = '';
    }

    function appendMessage(data) {
      const messagesDiv = document.getElementById('messages');
      const msgEl = document.createElement('div');
      
      const user = (typeof data === 'object' && data.user) ? data.user : 'Anonyme';
      const text = (typeof data === 'object' && data.text) ? data.text : data;
      
      const now = new Date();
      const currentTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const timeStr = (typeof data === 'object' && data.timestamp) ? data.timestamp : currentTime;

      const isMe = user === myUsername;
      
      msgEl.className = `msg ${isMe ? 'me' : ''}`;
      msgEl.innerHTML = `<div class="author"><span>${isMe ? 'Moi' : user}</span><span class="time">${timeStr}</span></div>${text}`;
      messagesDiv.appendChild(msgEl);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    socket.on('load-history', (history) => {
      document.getElementById('messages').innerHTML = '';
      if (Array.isArray(history)) {
        history.forEach(msg => appendMessage(msg));
      }
    });

    socket.on('chat-message', (data) => {
      appendMessage(data);
    });

    socket.on('system-message', (text) => {
      const messagesDiv = document.getElementById('messages');
      const msgEl = document.createElement('div');
      msgEl.className = 'msg system';
      msgEl.innerText = text;
      messagesDiv.appendChild(msgEl);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });
  </script>
</body>
</html>
